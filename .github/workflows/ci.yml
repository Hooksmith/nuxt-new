name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Tip: in a regulated environment pin every action to a full commit SHA; Dependabot keeps them current.
jobs:
  quality:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      # Report-only: current advisories are in build tooling (nuxt CLI/devtools), which never ships —
      # the deployable is Nitro's self-contained .output. The blocking gate is the Trivy scan of the
      # runtime image in the `image` job, which sees exactly what runs in production.
      - name: Dependency audit (report)
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: '**/coverage/'
          retention-days: 7

  e2e:
    name: E2E + accessibility (Playwright, axe)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  image:
    name: Container image (${{ matrix.app }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - { app: shell, health: /healthz }
          - { app: loans, health: /loans/healthz }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: bank-portal-${{ matrix.app }}:ci
          build-args: |
            APP=${{ matrix.app }}
            HEALTH_PATH=${{ matrix.health }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: bank-portal-${{ matrix.app }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
