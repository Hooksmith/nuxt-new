# Multi-zone routing at the edge (Gateway API — the successor to Ingress).
# Each path prefix is owned by an independently deployed zone.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bank-portal
spec:
  parentRefs:
    # Shared, platform-managed Gateway that terminates TLS and redirects HTTP -> HTTPS.
    - name: public-gateway
      namespace: gateway-system
      sectionName: https
  hostnames:
    - portal.example.com
  rules:
    # Live loan updates (Server-Sent Events): no request timeout.
    - matches:
        - path: { type: PathPrefix, value: /api/stream }
      backendRefs:
        - { name: shell, port: 80 }
      timeouts:
        request: 0s
    - matches:
        - path: { type: PathPrefix, value: /loans }
      backendRefs:
        - { name: loans, port: 80 }
      timeouts:
        request: 30s
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - { name: shell, port: 80 }
      timeouts:
        request: 30s
