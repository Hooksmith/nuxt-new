apiVersion: apps/v1
kind: Deployment
metadata:
  name: shell
  labels: { app.kubernetes.io/name: shell, app.kubernetes.io/component: zone }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 25%, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: shell }
  template:
    metadata:
      labels: { app.kubernetes.io/name: shell, app.kubernetes.io/part-of: bank-portal }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: shell }
      containers:
        - name: shell
          image: bank-portal/shell
          ports:
            - { name: http, containerPort: 3000 }
          envFrom:
            - configMapRef:
                name: bank-portal-config
            - secretRef:
                name: bank-portal-secrets
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            failureThreshold: 3
          lifecycle:
            # Give the gateway time to stop routing to this pod before it exits.
            preStop:
              sleep: { seconds: 5 }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: shell
  labels: { app.kubernetes.io/name: shell }
spec:
  selector: { app.kubernetes.io/name: shell }
  ports:
    - { name: http, port: 80, targetPort: http }
