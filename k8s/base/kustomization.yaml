apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bank-portal
labels:
  - pairs:
      app.kubernetes.io/part-of: bank-portal
    includeSelectors: false
resources:
  - namespace.yaml
  - configmap.yaml
  - shell.yaml
  - loans.yaml
  - httproute.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
# Image names/tags are set per environment in overlays/*.
