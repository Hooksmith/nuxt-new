apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target: { kind: Deployment }
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target: { kind: HorizontalPodAutoscaler, name: shell }
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 3
  # The demo loan simulator must never run against production.
  - target: { kind: ConfigMap, name: bank-portal-config }
    patch: |
      - op: replace
        path: /data/NUXT_LOAN_SIMULATOR_INTERVAL_MS
        value: '0'
images:
  - name: bank-portal/shell
    newName: ghcr.io/your-org/bank-portal-shell
    newTag: v0.1.0
  - name: bank-portal/loans
    newName: ghcr.io/your-org/bank-portal-loans
    newTag: v0.1.0
